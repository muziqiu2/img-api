# ============================================================
# 魔法师随机图片API - Docker Compose 一键部署
#
# 用法：
#   docker compose up -d
#
# 首次启动：容器自动从 GitHub Releases 拉取最新源码到 ./www
# 后续更新：登录后台 admin/ → 系统更新 → 一键更新（内置 updater.php）
# 数据/备份全部持久化在 ./www 目录下
# ============================================================

services:
  img-api:
    image: ghcr.io/muziqiu2/img-api:latest
    container_name: img-api
    ports:
      - "8080:80"              # 对外端口，按需修改
    volumes:
      - ./www:/var/www/html    # 代码 + 数据 + 备份持久化（首次启动自动拉取）
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
