# ============================================================
# 魔法师随机图片API - Supervisor 配置
# 单容器内同时管理 Nginx 与 PHP-FPM
# ============================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
startretries=5
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=5
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
