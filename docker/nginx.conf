# ============================================================
# 魔法师随机图片API - 容器内 Nginx 配置
# 已内置安全规则：data/、admin/logs/、.zip、隐藏文件一律 403，
# 防止 app.db 与备份包被公网下载（Docker 部署最容易漏掉的部分）。
# ============================================================

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # ---------- 敏感目录：直接 403 ----------
    location ~ ^/(data|admin\/logs)/ {
        deny all;
        return 403;
    }

    # ---------- 压缩包兜底：禁止下载任何 .zip ----------
    location ~* \.zip$ {
        deny all;
        return 403;
    }

    # ---------- 隐藏文件与目录（.git、.htaccess、.router.php 等）----------
    location ~ /\. {
        deny all;
        return 403;
    }

    # ---------- 敏感脚本兜底 ----------
    location ~ ^/(reset_config|generate_mock_stats)\.php$ {
        deny all;
        return 403;
    }

    location = /.router.php {
        deny all;
        return 403;
    }

    # ---------- 静态资源（7 天缓存，减磁盘压力）----------
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---------- PHP 转发 ----------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    # ---------- 默认 ----------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
